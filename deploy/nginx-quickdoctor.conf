# Install: sudo cp deploy/nginx-quickdoctor.conf /etc/nginx/sites-available/quickdoctor
# Replace yourdomain.com, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name quickdoctor.ie www.quickdoctor.ie;

    # Certbot will add SSL; after certbot, it redirects HTTP -> HTTPS

    root /var/www/quickdoctor-web;
    index index.html;

    # Legacy consultation URLs → static room page with query id
    # Quoted regex: unquoted {36} is parsed as nginx block syntax and breaks config test.
    location ~ "^/doctor/consultations/([0-9a-f-]{36})/?$" {
        return 302 /doctor/consultations/room?id=$1;
    }

    # Next static export + client-side routes
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # API → Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stripe webhook (same backend; needs raw body)
    location /api/webhooks/stripe {
        proxy_pass http://127.0.0.1:5000/api/webhooks/stripe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
